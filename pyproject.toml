[project]
name = "kinomaniac"
version = "0.1.0"
description = "Movie recommender with strict LLM grounding and guardrails"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.34.0",
    "openai>=1.50.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "tabulate>=0.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
